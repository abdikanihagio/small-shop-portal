# The shop's PostgreSQL database. Start it with:  docker compose up -d
# Reads PGUSER / PGPASSWORD / PGDATABASE / PGPORT from .env. Only this computer can connect (127.0.0.1).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-shop}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-shop}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - shop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  shop-pgdata:
