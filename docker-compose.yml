# The shop's PostgreSQL database. Start it with:  docker compose up -d
# Docker creates the ADMINISTRATOR account from .env (PG_ADMIN_USER / PG_ADMIN_PASSWORD; older setups
# without them use PGUSER / PGPASSWORD). The portal itself signs in with its own restricted account,
# made by:  node scripts/db-app-account.js
# Only this computer can connect (127.0.0.1).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:-${PGUSER:-shop}}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-${PGPASSWORD:?Set PG_ADMIN_PASSWORD in .env}}
      POSTGRES_DB: ${PGDATABASE:-shop}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - shop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  shop-pgdata:
